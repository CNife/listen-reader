# 单元测试基线：单模块 Android 应用，Robolectric + Compose 测试秒级可跑。
# run worktree 没有 local.properties，用 ANDROID_HOME 定位 SDK；也没有 node_modules，
# 而 JsExtractorContractTest 需要 Node + jsdom，所以先 npm ci（约 1 秒，命中缓存）。
# 跑完基线后 test 步骤仍会按意图驱动有针对性的端到端验证；真实 CI 由 .github/workflows/ci.yml 提供。
commands:
  test: "npm ci --silent && ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk} ./gradlew :app:testDebugUnitTest --console=plain"

# v1 的两次自动修复用尽后仍漏掉一个同类兄弟位点，本仓库把自动修复轮次放宽到三轮。
auto_fix:
  review: 3

# 仓库级审阅规则：只从 main 的可信副本读取，功能分支无法放宽。
review:
  path_instructions:
    - path: "app/src/main/java/com/cnife/listenreader/service/**"
      instructions: |
        服务层是唯一状态编排点，默认运行在 Dispatchers.Main.immediate。
        数据层、网络与文件 IO（Room、DataStore、文件、TTS、LLM）的异常必须在这一层捕获并写入用户当时可见的 State.error；入口初始化、打开资源、刷新资料库、设置写入等兄弟位点要共用同一兜底，不能只修当前一处而留下同类漏网。
        禁止在调用线程或主线程用 runBlocking 做 IO；阻塞 API 改为 suspend，由协程调度。
        新增「当前预览/当前资源」这类推导字段时，所有生成新预览或切换资源的路径都必须同步重置或更新它，否则旧值会让 UI 跳到过期对象。
    - path: "app/src/main/java/com/cnife/listenreader/service/ports/**"
      instructions: |
        端口只声明生产代码实际调用的能力。新增或保留没有生产调用方的端口成员属于超出意图的实质缺陷，按 auto-fix 报，不要作为 ask-user 问题留给人工决策。
    - path: "app/src/test/**"
      instructions: |
        测试通过公共接口断言可观察行为或状态；FakePorts / FakeReadingService 只用于构造场景，不能只断言 Fake 的调用或实现源码文本，也不要求为文档、构建配置或 Compose 布局微调新增测试。
    - path: "app/src/androidTest/**"
      instructions: |
        插桩测试面向真实平台集成（WebView 提取、Media3 后台播放、MediaMetadata），fixture 在 app/src/androidTest/assets/；不要要求把纯逻辑场景搬进仪器测试。

# 第三方与生成资产不进入 review 与文档检查，避免把整份第三方代码当变更审阅。
ignore_patterns:
  - "gradle/wrapper/gradle-wrapper.jar"
  - "*.mp3"
  - "app/src/main/assets/extract/readability.js"
  - "app/schemas/**"
  - "prototype/**"

# 文档归属：同一事实只在一个文件维护。
document:
  instructions: |
    README.md 面向用户：产品定位、功能、BYOK 配置与构建步骤。
    GLOSSARY.md 只维护领域术语；架构决策放 docs/adr/，agent 协作约定放 docs/agents/，调研笔记放 docs/research/。
    docs/agents/verification.md 是自验证通道（视觉快照、免改源码 E2E、广播命令与清理步骤）的唯一归属，AGENTS.md 只放指针与不变量、不复述命令细节。
    app/src/main/assets/extract/NOTICE 负责第三方资产署名，新增或升级第三方脚本时同步维护。
    代码约束与行为由代码和测试本身负责，不在文档中复述（例外：docs/agents/verification.md 记录的是验证流程，属于流程而非行为复述）。

# Test 步骤运行手册：只从 main 的可信副本读取。
test:
  instructions: |
    本仓库是单模块 Android 应用（compileSdk 35，minSdk 26），SDK 默认在 $HOME/Android/Sdk。按下面的三层阶梯按需升级验证成本：
    1) 秒级 JVM 基线与契约（必跑）：ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk} ./gradlew :app:testDebugUnitTest（commands.test 已内置同一命令）。除业务与 Compose 语义测试外，还包含 ArchitectureContractTest（服务层禁 runBlocking、端口无死成员、Room Schema 与模板正则）、JsExtractorContractTest（JVM 测试经 scripts/js-extract-harness.mjs 在 jsdom 里真实执行 readability.js + l1.js + l3.js，对 fixtures 断言提取结果与展开安全；需要 Node 24+ 与仓库根的 npm ci）、DebugControlReceiverTest（自验证广播契约）。
    2) JVM Compose 视觉快照自检（改 Compose 布局/样式/主题时）：./gradlew :app:testDebugUnitTest --tests "com.cnife.listenreader.ui.UiSnapshotTest"，直接读取 app/build/outputs/roborazzi/ 下的 PNG 判断布局、留白与深浅色对比（快照不进版本库，每次运行重新生成）。
    3) 免改源码的实机/模拟器 E2E（触及 WebView 提取、Media3 后台播放、真实 TTS 合成链路时）：无需修改 build.gradle.kts 或源码，按 docs/agents/verification.md 用 -PappIdSuffix=.nmtest 构建隔离包、启动 python3 scripts/mock-server.py、adb reverse 映射端口、再通过 DebugControlReceiver 广播注入 mock 端点与状态快照，配合 hs 驱动 UI。需要真实平台集成的契约仍可用 ./gradlew :app:connectedDebugAndroidTest。
    纯文档、配置、纯函数或状态逻辑改动：第 1 层即可，不做设备长跑。
    结束后清理：adb uninstall com.cnife.listenreader.nmtest、adb reverse --remove-all、停止 mock-server.py、./gradlew --stop、adb shell am force-stop com.cnife.listenreader。

# 上一版 PR 的 Testing 证据接近 19KB；折叠 Validation 尾段，作者叙述与 Intent 保持可见。
pr:
  appendix: collapsed
